[[inputs.http]]
  alias = "loc1_weather"
  name_override = "weather"
  urls = [
    "https://api.open-meteo.com/v1/forecast?latitude=${LOC1_LAT}&longitude=${LOC1_LON}&timezone=${LOC1_TZ}&wind_speed_unit=kn&past_days=4&forecast_days=4&hourly=temperature_2m,dew_point_2m,relative_humidity_2m,apparent_temperature,precipitation,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,surface_pressure,weather_code,is_day,visibility"
  ]
  interval = "4h"
  timeout = "10s"
  method = "GET"

  data_format = "value"
  data_type = "string"

  [inputs.http.tags]
    location_name = "${LOC1_NAME}"

[[inputs.http]]
  alias = "loc2_weather"
  name_override = "weather"
  urls = [
    "https://api.open-meteo.com/v1/forecast?latitude=${LOC2_LAT}&longitude=${LOC2_LON}&timezone=${LOC2_TZ}&wind_speed_unit=kn&past_days=4&forecast_days=4&hourly=temperature_2m,dew_point_2m,relative_humidity_2m,apparent_temperature,precipitation,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,surface_pressure,weather_code,is_day,visibility"
  ]
  interval = "4h"
  timeout = "10s"
  method = "GET"

  data_format = "value"
  data_type = "string"

  [inputs.http.tags]
    location_name = "${LOC2_NAME}"

[[processors.starlark]]
  namepass = ["weather"]
  source = '''
load("json.star", "json")
load("time.star", "time")

def apply(metric):
    loc_name = metric.tags.get("location_name")
    raw_body = metric.fields.get("value")
    if not raw_body:
        return metric

    data = json.decode(raw_body)
    hourly = data.get("hourly", {})
    times = hourly.get("time", [])
    temperature_2m = hourly.get("temperature_2m", [])
    dew_point_2m = hourly.get("dew_point_2m", [])
    relative_humidity_2m = hourly.get("relative_humidity_2m", [])
    apparent_temperature = hourly.get("apparent_temperature", [])
    precipitation = hourly.get("precipitation", [])
    cloud_cover = hourly.get("cloud_cover", [])
    wind_speed_10m = hourly.get("wind_speed_10m", [])
    wind_direction_10m = hourly.get("wind_direction_10m", [])
    wind_gusts_10m = hourly.get("wind_gusts_10m", [])
    pressure_msl = hourly.get("pressure_msl", [])
    surface_pressure = hourly.get("surface_pressure", [])
    weather_code = hourly.get("weather_code", [])
    is_day = hourly.get("is_day", [])
    visibility = hourly.get("visibility", [])

    lat = str(data.get("latitude"))
    lon = str(data.get("longitude"))
    tz = str(data.get("timezone"))

    new_metrics = []

    for i in range(len(times)):
        if i >= len(temperature_2m) or temperature_2m[i] == None:
            continue
        if i >= len(dew_point_2m) or dew_point_2m[i] == None:
            continue
        if i >= len(relative_humidity_2m) or relative_humidity_2m[i] == None:
            continue
        if i >= len(apparent_temperature) or apparent_temperature[i] == None:
            continue
        if i >= len(precipitation) or precipitation[i] == None:
            continue
        if i >= len(cloud_cover) or cloud_cover[i] == None:
            continue
        if i >= len(wind_speed_10m) or wind_speed_10m[i] == None:
            continue
        if i >= len(wind_direction_10m) or wind_direction_10m[i] == None:
            continue
        if i >= len(wind_gusts_10m) or wind_gusts_10m[i] == None:
            continue
        if i >= len(pressure_msl) or pressure_msl[i] == None:
            continue
        if i >= len(surface_pressure) or surface_pressure[i] == None:
            continue
        if i >= len(weather_code) or weather_code[i] == None:
            continue
        if i >= len(is_day) or is_day[i] == None:
            continue
        if i >= len(visibility) or visibility[i] == None:
            continue

        parsed_time = time.parse_time(times[i], "2006-01-02T15:04", tz)

        new_metric = Metric("weather")

        if loc_name:
            new_metric.tags["location_name"] = loc_name
        new_metric.tags["latitude"] = lat
        new_metric.tags["longitude"] = lon
        new_metric.tags["timezone"] = tz

        new_metric.fields["temperature_2m"] = float(temperature_2m[i])
        new_metric.fields["dew_point_2m"] = float(dew_point_2m[i])
        new_metric.fields["relative_humidity_2m"] = float(relative_humidity_2m[i])
        new_metric.fields["apparent_temperature"] = float(apparent_temperature[i])
        new_metric.fields["precipitation"] = float(precipitation[i])
        new_metric.fields["cloud_cover"] = float(cloud_cover[i])
        new_metric.fields["wind_speed_10m"] = float(wind_speed_10m[i])
        new_metric.fields["wind_direction_10m"] = float(wind_direction_10m[i])
        new_metric.fields["wind_gusts_10m"] = float(wind_gusts_10m[i])
        new_metric.fields["pressure_msl"] = float(pressure_msl[i])
        new_metric.fields["surface_pressure"] = float(surface_pressure[i])
        new_metric.fields["weather_code"] = float(weather_code[i])
        new_metric.fields["is_day"] = float(is_day[i])
        new_metric.fields["visibility"] = float(visibility[i])
        new_metric.time = parsed_time.unix_nano

        new_metrics.append(new_metric)

    return new_metrics
'''
